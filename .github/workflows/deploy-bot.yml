name: Deploy bot

# F4/#120 (ADR-0064/ADR-0065): apps/bot é um deployable Vercel separado, publicado em cadeia
# depois que "Deploy production" termina com sucesso — as migrations e as duas verificações de
# banco já rodaram e passaram nesse momento (esse workflow não repete nenhuma), então a ordem
# exigida (bot só depois de migration + verificação) fica garantida sem duplicar esses passos
# aqui. ADR-0041 é sobre a corrida entre o FRONTEND e as migrations que ele consome; apps/bot não
# introduz nenhuma migration própria e não compete por esse recurso.
#
# `pnpm typecheck`/`pnpm test` na raiz (que "Deploy production" já roda) cobrem TODO o workspace,
# apps/bot incluído — não há necessidade de repeti-los aqui só para publicar o artefato que já
# passou por eles no mesmo commit.
on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ADR-0064/ADR-0065: credenciais próprias do projeto apps/bot na Vercel — nunca as de
    # "production" (apps/web). Environment "bot" precisa ser criado manualmente no repo antes do
    # primeiro run real, mesma pendência operacional do Environment "logos"/"avisos".
    environment: bot
    steps:
      - uses: actions/checkout@v4

      # Diferente do "Guard production secrets" do deploy.yml (falha alto): aqui a AUSÊNCIA do
      # Environment é o estado normal até o projeto apps/bot existir de fato na Vercel — e este
      # workflow dispara em TODO "Deploy production" bem-sucedido, ou seja, em todo merge para
      # master. Falhar alto faria essa pendência operacional virar um red X permanente na aba
      # Actions. Em vez disso, registra e sai limpo (verde) — ativa sozinho assim que o
      # Environment ganhar os secrets.
      # Checa TODO secret que algum passo abaixo consome — não só os três da Vercel. O smoke
      # (`SmokeEnvironment` em test/smoke-production.mts) exige `FAREJO_BOT_WEBHOOK_PATH` sem
      # default; faltando, sem essa checagem o job passaria por build+deploy (gastando um
      # deployment real da Vercel) só para o smoke falhar por env ausente — e viraria o mesmo red
      # X permanente que este guard existe para evitar, só que um passo mais tarde.
      # `VERCEL_AUTOMATION_BYPASS_SECRET` fica de fora de propósito: é opcional no schema do smoke
      # (site sem Deployment Protection também é um alvo válido). `FAREJO_BOT_WAF_BYPASS_SECRET`
      # ENTRA na lista obrigatória: a ordem de avaliação da Vercel é Firewall da plataforma →
      # Deployment Protection → WAF do projeto, então numa deployment staged, depois que o bypass
      # de Deployment Protection é aceito, a requisição segue e cai na WAF — sem o bypass da WAF
      # junto, o próprio smoke pré-promoção é negado com 403 antes de alcançar a aplicação
      # (achado corrigido ao vivo, ver o comentário em test/smoke-production.mts). Só
      # `FAREJO_BOT_PRODUCTION_URL` fica de fora: só o passo pós-promoção o usa, e ele se
      # auto-degrada com um aviso próprio se faltar — não vale gastar build+deploy à toa por causa
      # de um secret que só um passo NÃO-bloqueante consome.
      - name: Check bot deployment configured
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          FAREJO_BOT_WEBHOOK_PATH: ${{ secrets.FAREJO_BOT_WEBHOOK_PATH }}
          FAREJO_BOT_WAF_BYPASS_SECRET: ${{ secrets.FAREJO_BOT_WAF_BYPASS_SECRET }}
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("VERCEL_ORG_ID")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID")
          [ -z "$FAREJO_BOT_WEBHOOK_PATH" ] && missing+=("FAREJO_BOT_WEBHOOK_PATH")
          [ -z "$FAREJO_BOT_WAF_BYPASS_SECRET" ] && missing+=("FAREJO_BOT_WAF_BYPASS_SECRET")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Environment \"bot\" ainda não tem os secrets: ${missing[*]}. Pendência operacional; publicação do apps/bot pulada."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.configured == 'true'
        uses: pnpm/action-setup@v4

      - if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - if: steps.check.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      # Mesma observação do "monorepo requirement" de deploy.yml: o CLI roda da raiz para
      # enxergar o workspace pnpm-hoisted inteiro; o "Root Directory" do projeto na Vercel
      # (apps/bot) decide o que de fato é buildado/publicado.
      - if: steps.check.outputs.configured == 'true'
        name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: apps/bot/node_modules/.bin/vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - if: steps.check.outputs.configured == 'true'
        name: Build Vercel artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: apps/bot/node_modules/.bin/vercel build --prod --token="$VERCEL_TOKEN"

      # ADR-0056, mesmo padrão do site: `--skip-domain` cria o deployment SEM mover o domínio.
      # Produção continua servindo o webhook anterior enquanto o smoke roda contra o novo, e só
      # uma publicação aprovada chega ao público — sem depender de `vercel rollback`.
      - if: steps.check.outputs.configured == 'true'
        name: Deploy prebuilt artifact (staged, no domain)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(apps/bot/node_modules/.bin/vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # #120, corrigido DUAS vezes depois de testar ao vivo: prova só a camada de APLICAÇÃO
      # contra o deployment staged, ainda não promovido — nunca afirma que a regra de WAF está
      # configurada certa, só usa o bypass dela pra conseguir alcançar a aplicação. A ordem de
      # avaliação da Vercel é Firewall da plataforma → Deployment Protection → WAF do projeto: numa
      # deployment staged, sem NENHUM bypass a Deployment Protection intercepta antes da WAF ser
      # avaliada (confirmado ao vivo: 401/302 dela, nunca chega na regra) — então testar "negado
      # sem bypass nenhum" aqui falharia SEMPRE. Mas, uma vez aceito o bypass de Deployment
      # Protection, a requisição PROSSEGUE e a WAF do projeto avalia de verdade — sem o bypass dela
      # TAMBÉM, o próprio smoke é negado com 403 antes de alcançar a aplicação (bug real, achado
      # disparando este workflow de verdade pela primeira vez após o primeiro conserto). Os DOIS
      # bypasses viajam juntos por isso. Ver "Confirm WAF on production domain" abaixo (lá sim
      # afirma a regra em si, contra o domínio real, que não tem Deployment Protection), e o
      # comentário no topo de test/smoke-production.mts.
      - if: steps.check.outputs.configured == 'true'
        name: Smoke test the staged bot deployment
        env:
          FAREJO_BOT_SITE_URL: ${{ steps.deploy.outputs.url }}
          FAREJO_BOT_WEBHOOK_PATH: ${{ secrets.FAREJO_BOT_WEBHOOK_PATH }}
          FAREJO_BOT_WAF_BYPASS_SECRET: ${{ secrets.FAREJO_BOT_WAF_BYPASS_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm --filter @farejo/bot test:smoke:production

      # Só aqui o webhook público passa a apontar para o artefato novo. Falha em qualquer passo
      # acima (incluindo o smoke) deixa a etapa "Promote" sem rodar — produção intacta no
      # deployment anterior, nada para reverter.
      - if: steps.check.outputs.configured == 'true'
        name: Promote to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: apps/bot/node_modules/.bin/vercel promote "${{ steps.deploy.outputs.url }}" --token="$VERCEL_TOKEN" --yes

      # Só aqui dá pra provar a regra em si (não só o bypass dela), e só depois de promovido: o
      # domínio de produção não tem Deployment Protection por padrão (diferente do deployment
      # staged do smoke acima), então uma requisição sem NENHUM header cai direto na WAF — dá pra
      # observar a regra de Deny isolada, o que staged nunca permite.
      # Não-bloqueante de propósito (`continue-on-error: true` no PASSO, não no job): a publicação
      # já aconteceu, o plano Hobby da Vercel recusa `vercel rollback` depois do primeiro uso
      # (mesmo motivo que já descartou esse padrão no deploy.yml do site), e uma regra de WAF mal
      # configurada se conserta no dashboard da Vercel, não re-rodando este workflow. O script
      # termina com `exit 1` quando algo diverge — sem isso, `continue-on-error` fica inerte e o
      # passo aparece verde normal, escondendo justamente o que deveria aparecer.
      - if: steps.check.outputs.configured == 'true'
        name: Confirm WAF on production domain
        continue-on-error: true
        env:
          # Nome DIFERENTE de propósito do `FAREJO_BOT_SITE_URL` usado no passo de smoke acima:
          # lá é a URL efêmera do deployment staged (`steps.deploy.outputs.url`); aqui é o domínio
          # fixo de produção (secret novo). Mesmo nome pros dois confundiria quem lesse o workflow.
          FAREJO_BOT_PRODUCTION_URL: ${{ secrets.FAREJO_BOT_PRODUCTION_URL }}
          FAREJO_BOT_WEBHOOK_PATH: ${{ secrets.FAREJO_BOT_WEBHOOK_PATH }}
          FAREJO_BOT_WAF_BYPASS_SECRET: ${{ secrets.FAREJO_BOT_WAF_BYPASS_SECRET }}
        run: |
          if [ -z "$FAREJO_BOT_PRODUCTION_URL" ] || [ -z "$FAREJO_BOT_WAF_BYPASS_SECRET" ]; then
            echo "::notice::FAREJO_BOT_PRODUCTION_URL ou FAREJO_BOT_WAF_BYPASS_SECRET ausente — confirmação de WAF pulada. Pendência operacional, não um achado de regressão; a publicação já aconteceu e não depende disto."
            exit 0
          fi

          url="$FAREJO_BOT_PRODUCTION_URL/api/$FAREJO_BOT_WEBHOOK_PATH"
          failed=0

          denied=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$url" -H "content-type: application/json" -d '{"update_id":0}')
          if [ "$denied" != "403" ]; then
            echo "::warning::regra de Deny: esperado 403 (Vercel Firewall) para requisição sem bypass no domínio de produção, recebido $denied."
            failed=1
          else
            echo "OK: requisição sem bypass negada na borda (403)."
          fi

          reached=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$url" -H "content-type: application/json" -H "x-farejo-bot-smoke-bypass: $FAREJO_BOT_WAF_BYPASS_SECRET" -H "x-telegram-bot-api-secret-token: smoke-secret-propositalmente-errado" -d '{"update_id":0}')
          if [ "$reached" != "401" ]; then
            echo "::warning::regra de Bypass: esperado 401 (aplicação) com bypass da regra de WAF, recebido $reached."
            failed=1
          else
            echo "OK: bypass da regra de WAF alcança a aplicação, que recusa secret_token errado (401)."
          fi

          if [ "$failed" = "1" ]; then
            echo "::error::confirmação de WAF pós-promoção encontrou divergência — verifique as regras no dashboard da Vercel. A publicação já aconteceu e NÃO foi revertida."
            exit 1
          fi
