name: Deploy scraper production

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: ID of the approved Plan scraper release run (valid for 24 hours)
        required: true
        type: string
      approve:
        description: I approve the commit, tested image and Terraform changes shown for this release
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: scraper-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      inputs.approve && github.ref == 'refs/heads/master' &&
      github.actor_id == '54454575' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      GCP_RELEASE_BUCKET: ${{ vars.GCP_RELEASE_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_DEPLOYER_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          request_reason: farejo-deploy-${{ github.run_id }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Apply the approved plan and verify configuration
        run: node scripts/gcp/release.mjs deploy
