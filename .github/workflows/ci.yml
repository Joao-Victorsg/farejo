name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release security policy tests
        run: node --test scripts/gcp/*.test.mjs

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Validate administrative and operational Terraform
        run: |
          terraform -chdir=infra/gcp fmt -check -recursive
          terraform -chdir=infra/gcp init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/gcp validate
          terraform -chdir=infra/gcp/runtime init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/gcp/runtime validate

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.109.1

      - name: Start local Supabase stack
        run: supabase start

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Chromium for browser smoke tests
        run: pnpm --filter @farejo/web exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Upload browser test differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3
