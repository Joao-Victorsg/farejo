name: Plan scraper release

on:
  workflow_run:
    workflows: [Prepare scraper release]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: scraper-production
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.id == 1297090348
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      GCP_RELEASE_BUCKET: ${{ vars.GCP_RELEASE_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check whether a candidate was produced
        id: candidate
        run: node scripts/gcp/release.mjs probe
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.candidate.outputs.ready == 'true'
        with:
          name: scraper-candidate
          path: .local/candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: steps.candidate.outputs.ready == 'true'
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: steps.candidate.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_PLANNER_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLANNER_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          request_reason: farejo-plan-${{ github.run_id }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        if: steps.candidate.outputs.ready == 'true'
      - name: Prepare private plan and approval summary
        if: steps.candidate.outputs.ready == 'true'
        run: node scripts/gcp/release.mjs plan
