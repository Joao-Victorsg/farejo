name: Apply category curation

# O deploy aplica as migrations antes de publicar a UI; só depois projetamos o manifesto
# aprovado. A invalidação deixa o filtro visível sem depender da próxima expiração do cache.
on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curation-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: curation
    env:
      FAREJO_CURATION_DATABASE_URL: ${{ secrets.FAREJO_CURATION_DATABASE_URL }}
      FAREJO_SUPABASE_CA_CERT: ${{ secrets.FAREJO_SUPABASE_CA_CERT }}
      CATALOG_INVALIDATION_URL: ${{ secrets.CATALOG_INVALIDATION_URL }}
      CATALOG_INVALIDATION_SECRET: ${{ secrets.CATALOG_INVALIDATION_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply approved category manifest when present
        run: |
          if [ -f curation/categories-manifest.json ]; then
            pnpm --filter @farejo/scraper curate:categories --apply
          else
            echo "No approved category manifest at this revision"
          fi
